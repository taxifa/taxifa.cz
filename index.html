<!doctype html>
<html lang="cs">
<head>

  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">

  <meta name="theme-color" content="#050d1c">

  <link rel="icon" href="assets/taxifa-symbol.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora aurora-blue" aria-hidden="true"></div>
  <div class="aurora aurora-gold" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>

  <div class="page-shell">
    <header class="site-header">
      <img class="brand" src="assets/taxifa-logo.svg" alt="Taxifa">
      <p class="status"><span aria-hidden="true"></span>Připravujeme</p>
    </header>

    <main class="hero">
      <div class="symbol-wrap" aria-hidden="true">
        <span class="symbol-halo"></span>
        <img src="assets/taxifa-symbol.svg" alt="">
      </div>

      <p class="eyebrow">Daně. Jednoduše.</p>
      <h1>Taxifa se<br><em>připravuje.</em></h1>
      <p class="lead">Tvoříme jednodušší a srozumitelnější cestu k daňovému přiznání — bez zbytečného stresu a krok za krokem.</p>

      <div class="loading" aria-label="Taxifa se připravuje">
        <div class="loading-line" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <p>Brzy bude snazší mít v daních jasno.</p>
      </div>
    </main>

    <footer>
      <p>Registrace ani veřejný přístup do aplikace zatím nejsou spuštěné.</p>
      <span>© 2026 Taxifa</span>
    </footer>
  </div>
